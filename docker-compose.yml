services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-fake}
      LLM_MODEL: ${LLM_MODEL:-anthropic:claude-opus-5}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-anthropic:claude-haiku-4-5}
      LLM_SEARCH_MODEL: ${LLM_SEARCH_MODEL:-anthropic:claude-sonnet-5-5}
      RESEARCH_MODE: ${RESEARCH_MODE:-native}
      WEB_SEARCH_MAX_USES: ${WEB_SEARCH_MAX_USES:-4}
      LLM_TEXT_ONLY_MODELS: ${LLM_TEXT_ONLY_MODELS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      FACTCHECK_API_KEY: ${FACTCHECK_API_KEY:-}
      DETECTOR_API_KEY: ${DETECTOR_API_KEY:-}
      DETECTOR_URL: ${DETECTOR_URL:-https://developer-portal.walterwrites.ai/api/image-detector/predict/}
      DETECTOR_THRESHOLD: ${DETECTOR_THRESHOLD:-0.9}
      REVERSE_IMAGE_API_KEY: ${REVERSE_IMAGE_API_KEY:-}
      REVERSE_IMAGE_DAILY_LIMIT: ${REVERSE_IMAGE_DAILY_LIMIT:-30}
      REVERSE_IMAGE_TRUSTED_DOMAINS: ${REVERSE_IMAGE_TRUSTED_DOMAINS:-}
      IMAGE_CONTEXT_URL: http://image-context:8001
      IMAGE_CONTEXT_API_KEY: ${IMAGE_CONTEXT_API_KEY:-}
      OCR_TIMEOUT: ${OCR_TIMEOUT:-25}
      IMAGE_VISION_ENABLED: "true"
      IMAGE_CONTEXT_TIMEOUT: ${IMAGE_CONTEXT_TIMEOUT:-600}
      STAGE_TIMEOUT: ${STAGE_TIMEOUT:-30}
      WEB_STAGE_TIMEOUT: ${WEB_STAGE_TIMEOUT:-180}
      POSTGRES_URL: ""
      TRACE_DIR: /app/traces
    volumes:
      - check-traces:/app/traces
    depends_on:
      image-context:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  image-context:
    build: ./frontend/image-context
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      VISION_ENABLED: "true"
      OLLAMA_URL: http://ollama:11434
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:4b-instruct}
      VISION_TIMEOUT: ${VISION_TIMEOUT:-540}
      CONTEXT_API_KEY: ${IMAGE_CONTEXT_API_KEY:-}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:4b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$VISION_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
  db:
    profiles: [database]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: factcheck
      POSTGRES_PASSWORD: factcheck
      POSTGRES_DB: factcheck
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  check-traces:
  ollama-models:
