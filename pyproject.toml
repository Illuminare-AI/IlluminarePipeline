[project]
name = "factcheck-pipeline"
version = "0.1.0"
description = "Multimodal social media fact checker: backend pipeline and API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "ImageHash>=4.3",
]

[project.optional-dependencies]
c2pa = ["c2pa-python>=0.6"]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "sentence-transformers>=2.2",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "sqlalchemy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
